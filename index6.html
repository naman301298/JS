<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
          display:grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: 60px 1fr 50px  ;
  height:100vh;
  /* background-color: aqua; */
    }
    
body{
margin: 0%;
}
.header{
  /* grid-column:1 / 3; */
  background:black;
  color:white;
  display:flex;
  align-items:center;
  padding-left:20px;
}
.sidebar{
  background:#ddd;
  padding:20px;
}
.content{
  background:#f5f5f5;
  padding:20px;

}
.footer{
  grid-column:1 / 3;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
<body>
    <div class="container">
    <div class="header">header</div>
    <div class="sidebar">Sidebar</div>
    <div class="content">Main Content</div>
    <div class="footer">Footer</div>
    </div>
</body>
</html>
