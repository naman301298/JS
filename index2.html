<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .price {
      color: red;
      font-size: 20px;
      font-weight: bold;
    }
    .discount {
      color: red;
    }
    .brand {
      color: purple;
    }
    .user {
      font-weight: bold;
    }

    .order-id {
      color: green;
    }
    #header {
      background: black;
    }

    .text {
      color: blue;
    }
  </style>
  <body>
    <p>hello <span> Developer </span></p>

    <span>First</span>
    <span>Second</span>
    <span>Three</span>

    <p>hello <span style="color: rgb(96, 34, 211)">Naman</span></p>

    <p>price: <span class="price"> ₹499 </span></p>

    <button>Buy <span class="discount">50% OFF</span></button>

    <h1>Welcome to <span class="brand">XO Bestie</span></h1>

    <p class="message">
      Hello <span class="user">Naman</span>, your order
      <span class="order-id">#1201</span> is confirmed.
    </p>

    <button id="loginBtn" class="btn primary" disabled>Login</button>

    <input type="text" disabled />

    <div id="header">Website Header</div>

    <p class="text">Paragraph 1</p>
    <p class="text">Paragraph 2</p>
    <p class="text">Paragraph 3</p>

    <form>
      <input type="text" placeholder="Enter name" />

      <input type="email" placeholder="Enter email" />

      <button>Submit</button>

      <form>
        <label>Name</label>
        <input type="text" required />

        <label>Email</label>
        <input type="email" required />

        <label>Password</label>
        <input type="password" />

        <button type="submit">Login</button>









      </form>
    </form>
  </body>
</html>
