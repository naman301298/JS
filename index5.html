
<!--🚀 2️⃣ Dashboard using -Flex->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar</title>
    <style>
        body{
            margin: 0;
            background-color: aquamarine;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;

padding-top: 10px;
padding-bottom: 10px;
padding-left: 15px;
padding-right: 15px;            background-color: black;
              color: white;


        }
        .menu{
display:  flex;
gap: 20px;
        }
        .btn{
            padding: 10px 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>Logo</h2>


        <div class="menu">
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </div>

    <button class="btn">Login</button>
    </div>


    
</body>
</html>
